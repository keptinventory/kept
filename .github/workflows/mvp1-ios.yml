name: iOS MVP1

on:
  push:
    branches: [main, integration/mvp1]
    paths: &ios_paths
      - '.github/workflows/mvp1-ios.yml'
      - 'apps/ios/**'
      - 'apps/web/**'
      - 'apps/server/src/auth/native.ts'
      - 'apps/server/src/sync/**'
      - 'packages/shared/**'
      - '.nvmrc'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'vitest.config.ts'
  pull_request:
    paths: *ios_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mvp1-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundled-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run --project @kept/web apps/web/src/native
      - run: pnpm --filter @kept/web build:ios

  simulator:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kept/ios sync
      - run: swift test --package-path apps/ios/NativeStore
      - name: Compile for iOS Simulator without signing
        run: |
          xcodebuild -version
          xcodebuild -project apps/ios/ios/App/App.xcodeproj -scheme App \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "${RUNNER_TEMP}/kept-ios" CODE_SIGNING_ALLOWED=NO build
