name: kept-dev
# Ports are published on 127.0.0.1 only: the dev database, mail and S3 have well-known passwords
# and must not answer on the LAN or a tailnet.
services:
  db:
    image: pgvector/pgvector:0.8.6-pg18-bookworm
    # Eleven e2e servers share this Postgres (apps/web/e2e/serve.mjs), each with its own small
    # pools and pg-boss: the default 100 connections ran out in CI. Dev and CI only.
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kept
      TZ: UTC
    ports: ["127.0.0.1:5452:5432"]
    volumes:
      - kept-dev-db:/var/lib/postgresql
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kept"]
      interval: 2s
      retries: 30
  mail:
    image: axllent/mailpit:v1.31.2
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
  # S3-compatible storage for the S3 driver (T18, Q18). Only with `--profile s3`, so a plain
  # `docker compose up` stays Postgres + Mailpit. Path-style only (no RUSTFS_SERVER_DOMAINS), so
  # clients set KEPT_S3_FORCE_PATH_STYLE=true. Dev credentials, never used anywhere else. The
  # tests create their own bucket (storage/s3.test.ts).
  s3:
    profiles: ["s3"]
    image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    environment:
      RUSTFS_ACCESS_KEY: kept-dev
      RUSTFS_SECRET_KEY: kept-dev-secret
    ports: ["127.0.0.1:9452:9000"]
    volumes:
      - kept-dev-s3:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 2s
      retries: 30
volumes:
  kept-dev-db: {}
  kept-dev-s3: {}
