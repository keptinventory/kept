configuration:
  public_url:
    name: Адреса Kept
    description: >-
      Адреса, яку використовують телефони, надруковані етикетки та поштові посилання, наприклад
      http://homeassistant.local:8080 або https://kept.example.org. Порожньо: ім'я хоста Home
      Assistant і порт цього додатка. Без шляху.
  log_level:
    name: Рівень деталізації журналу
    description: Скільки Kept записує на вкладці Журнал.
  smtp_url:
    name: Вихідна пошта
    description: >-
      URL smtp:// або smtps:// з обліковим записом, наприклад
      smtps://user:password@mail.example.org. Порожньо: Kept не надсилає пошту.
  smtp_from:
    name: Відправник пошти
    description: Поле From у пошті Kept, наприклад Kept <kept@example.org>.
  ssl:
    name: https на порту Kept
    description: >-
      Обслуговувати порт Kept через https із сертифікатом Home Assistant з /ssl. Токени, ключі
      доступу, камера та встановлюваний додаток потребують https. Перезапустіть додаток після
      оновлення сертифіката.
  certfile:
    name: Файл сертифіката
    description: Ім'я файлу сертифіката у /ssl.
  keyfile:
    name: Файл приватного ключа
    description: Ім'я файлу приватного ключа у /ssl.
  hsts:
    name: HSTS
    description: >-
      При увімкненому https Kept повідомляє браузерам використовувати https для цього імені хоста
      на кожному порті протягом року, включаючи власний Home Assistant. off: коли Home Assistant
      або інший додаток на цьому імені хоста працює на простому http; браузери забудуть це при
      наступному https-візиті до Kept.
  http_sign_in_days:
    name: Тривалість входу через http
    description: >-
      Кількість днів, протягом яких діє вхід через простий http, від 1 до 30, оновлюється при
      використанні; 7 підходить для домашньої мережі. Порожньо: 12 годин, не оновлюється. Не має
      ефекту при увімкненому https. Через простий http cookie входу може скопіювати хтось, хто
      бачить трафік; якщо це ввімкнено, скопійований cookie працює, поки його використовують, доки
      той пристрій не вийде або ви не вийдете на інших пристроях.
  extra_addresses:
    name: Додаткові адреси
    description: >-
      Інші адреси, на які відповідає цей Kept, розділені комами, точно як показує браузер:
      http://192.0.2.20:8080. Без масок, і той самий http або https, що й у адресі Kept. На кожній
      вхід окремий. Посилання, пошта, ключі доступу та AI-додатки залишаються на адресі Kept.
      Перелічуйте лише адреси, що досягають цього Kept.
  oidc_issuer:
    name: OIDC-видавець
    description: >-
      Вхід через вашого постачальника ідентифікації: URL видавця точно як у його документі
      виявлення. Задано з ідентифікатором клієнта — увімкнено OIDC-вхід. URL перенаправлення для
      реєстрації: адреса Kept з /api/v1/auth/callback/oidc.
  oidc_client_id:
    name: Ідентифікатор клієнта OIDC
    description: Ідентифікатор клієнта від постачальника ідентифікації.
  oidc_client_secret:
    name: Секрет клієнта OIDC
    description: Секрет клієнта, для конфіденційного клієнта. Порожньо для публічного клієнта.
  oidc_name:
    name: Назва кнопки OIDC
    description: >-
      Назва постачальника на "Увійти за допомогою …", максимум 60 символів. Порожньо: OIDC.
  oidc_autoprovision_domains:
    name: OIDC-реєстрація за доменом електронної пошти
    description: >-
      Домени електронної пошти, розділені комами (точні, без піддоменів), чиї користувачі
      отримують обліковий запис при першому вході. Порожньо: лише за запрошенням.
  oidc_autoprovision_groups:
    name: Реєстрація OIDC за групою
    description: >-
      Групи, розділені комами (точні), члени яких отримують обліковий запис при першому вході.
      Порожньо: лише за запрошенням.
  oidc_groups_claim:
    name: OIDC claim груп
    description: >-
      Claim токена ID, у якому зазначені групи. Порожньо: groups.
  oidc_scopes:
    name: Області доступу OIDC
    description: >-
      Запитувані області доступу, розділені пробілами. Порожньо: openid email profile.
  google_client_id:
    name: Ідентифікатор клієнта Google
    description: >-
      Увійти через Google, за допомогою клієнта OAuth з Google Cloud. Встановіть разом із
      секретом, вхід через Google увімкнено, лише для існуючих облікових записів і запрошених
      осіб. Google вимагає адресу Kept на https із публічним доменним ім'ям (не http, не .local і
      не IP-адреса): встановіть адресу Kept, наприклад ім'я DuckDNS з https на порті Kept. URL
      перенаправлення для реєстрації: адреса Kept і потім /api/v1/auth/callback/google.
  google_client_secret:
    name: Секрет клієнта Google
    description: Секрет клієнта OAuth.
  apprise_url:
    name: Сервер Apprise
    description: >-
      Сервер API Apprise, через який проходять канали сповіщень Apprise, наприклад
      http://apprise:8000. Порожньо: люди не можуть додавати канали Apprise.
  signup_open:
    name: Реєстрація
    description: >-
      true залишає реєстрацію відкритою, false закриває її (лише за запрошеннями); налаштування
      адміністратора тоді показується як заблоковане. Не встановлено: адміністратор вирішує в Kept
      (Адміністратор → Реєстрація).
  max_file_mb:
    name: Обмеження завантаження (МБ)
    description: >-
      Найбільший файл, який можна завантажити, від 1 до 2048. Порожньо: 25.
network:
  8080/tcp: Власна адреса Kept для телефонів, етикеток і посилань на пошту
