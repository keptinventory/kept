# A release announced in the Discord server's #announcements, through the webhook in the
# DISCORD_RELEASES_WEBHOOK secret. release.yml calls it after the GitHub release is published (a
# release made by a workflow's token starts no `release` event); `release: published` covers one
# published by hand, and Run workflow posts an existing release again.
#
# The post is the release's Highlights, or, without them, its "What's changed" with the folded
# parts left out (a release in the earlier layout: its changelog part, up to the release record),
# headings made bold, with a link to the whole release; never anything folded in <details>. A final
# release pings the Release pings role; a prerelease is posted without the ping.
#
# No third-party action: the webhook URL is a secret, so it only goes to curl.
name: discord

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag, vX.Y.Z
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: A published release to announce, e.g. v1.12.3
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Post the release to Discord
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
          # The Release pings role in the Kept server.
          ROLE: '1562434808234377256'
        run: |
          [[ -n $WEBHOOK ]] || { echo "::warning::DISCORD_RELEASES_WEBHOOK is not set; nothing posted"; exit 0; }
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::not a release tag: $TAG"; exit 1; }
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json name,url,body,isPrerelease,publishedAt >release.json
          jq --arg role "$ROLE" '
            # The sections of the release page, by their "## " heading. (No apostrophe anywhere
            # in this program: it sits in single quotes.)
            def sections: split("\n") | reduce .[] as $l ([];
              if ($l | test("^## ")) then . + [{ h: $l[3:], lines: [] }]
              elif length == 0 then [{ h: "", lines: [$l] }]
              else .[-1].lines += [$l] end);
            def section($h): map(select(.h == $h)) | first
              | if . then "## \(.h)\n\n" + (.lines | join("\n")) else null end;
            (.body | gsub("\r"; "")) as $body
            | ($body | sections) as $s
            # The highlights when the release has them, else what changed without its folded
            # parts; a release in the earlier layout posts its changelog part (the notes before
            # the "Built … from commit" line of the record, without its "## X.Y.Z (date)" heading).
            | ($s | section("Highlights")
                // ($s | section("What\u0027s changed") | if . then gsub("<details>[\\s\\S]*?</details>"; "") else null end)
                // ($body | split("\nBuilt ")[0] | split("\n") | map(select(test("^## [0-9]") | not)) | join("\n"))
              | split("\n")
              | map(if test("^### ") then "**" + .[4:] + "**"
                    elif test("^## ") then "__**" + .[3:] + "**__" else . end)
              | join("\n") | gsub("\n{3,}"; "\n\n") | gsub("^\\s+|\\s+$"; "")) as $notes
            | ($notes | if length > 3800 then .[0:3800] + "…" else . end) as $text
            | {
                username: "Kept Releases",
                content: (if .isPrerelease then "A Kept prerelease is out." else "<@&\($role)> a new Kept release is out!" end),
                allowed_mentions: { parse: [], roles: (if .isPrerelease then [] else [$role] end) },
                embeds: [{
                  title: .name,
                  url: .url,
                  description: ($text + "\n\n[Full release notes](\(.url))"),
                  color: 15773754,
                  footer: { text: "Kept" },
                  timestamp: .publishedAt
                }]
              }' release.json >payload.json
          jq -r '.embeds[0].description' payload.json
          curl -fsS --retry 3 -H 'Content-Type: application/json' --data @payload.json "$WEBHOOK" >/dev/null
          echo "posted $TAG"
